  <!-- Preload the home masterplan GLB so the browser starts fetching it at
       HTML-parse time, in parallel with React / Vite bootstrap. Without this
       the fetch only begins after <Canvas> mounts and useGLBLoader fires its
       useEffect — several hundred ms of wasted time on every cold load.
       crossorigin is required: the later fetch() in use-glb-loader.js is a
       same-origin request but goes through the Fetch API (not <img>/<script>),
       and the browser only reuses a preload-cache entry when the CORS mode
       of the preload tag matches the CORS mode of the consuming request.
       Omitting it would cause the browser to fetch the file TWICE.

       Two variants, gated by `media` so each device only fetches the one it
       will actually use (see getHomeModelPath in src/utils/constant.js):
       desktop gets the full-texture-resolution model, mobile/tablet
       (<1024px, matching hooks/use-mobile.js's MOBILE_BREAKPOINT) gets the
       VRAM-reduced variant. A media-gated <link rel="preload"> is a real,
       standard browser feature — the non-matching one is never fetched.

       KNOWN APPROXIMATION: getHomeModelPath() actually decides via
       getDeviceTier(), which also downgrades a weak-GPU DESKTOP (viewport
       >=1024, e.g. an old integrated GPU) to the reduced variant — a plain
       CSS media query here can only see viewport width, not GPU capability,
       so that specific machine's preload hint targets the (correct-for-most-
       desktops but wrong-for-it) full-resolution file, and the actually-
       correct reduced one gets fetched separately without the preload
       head-start. Suboptimal for that one case, not incorrect — the JS-driven
       fetch in use-home-scene.js still resolves the right file either way. -->
  <link
    rel="preload"
    as="fetch"
    href="./models/88RES-06_05-2.glb"
    media="(min-width: 1024px)"
    crossorigin
  />
  <link
    rel="preload"
    as="fetch"
    href="./models/88RES-06_05-2-mobile.glb"
    media="(max-width: 1023px)"
    crossorigin
  />
  <!-- Preload the HDR panorama used for window glass reflections (EnvironmentSetup).
       REAL BUG FIXED HERE, confirmed live on production: this was `as="fetch"`,
       which only matches requests actually issued via the Fetch API (or XHR).
       THREE.TextureLoader (node_modules/three/src/loaders/TextureLoader.js)
       loads via ImageLoader, i.e. `new Image()` / `img.src = url` — a plain
       image request, not fetch() — so the preload's `as` never matched the
       real consuming request's destination, and Chrome correctly warned that
       the preloaded resource went unused ("was preloaded using link preload
       but not used within a few seconds"). Fixed to `as="image"` to match how
       it's actually loaded; `crossorigin` stays since it's still required for
       the preload cache entry to be reused by the later same-origin request
       (this file is fetched via `new Image()`, not a `<script>`/`<style>`, so
       Chrome still treats it as a CORS-mode-sensitive resource for cache
       matching purposes). -->
  <link rel="preload" as="image" href="./hdr/80m-nano-green.jpg" crossorigin />

  <!-- Static boot splash (below) needs its rules available at first paint, so
       they are inlined here rather than shipped in src/index.css: an external
       stylesheet is fine for that file because it is still render-blocking,
       but keeping this tiny and dependency-free means it never needs to wait
       on the Tailwind build/purge pipeline to keep the classes around.

       This is a plain-CSS replica of the real HomeLoader (see
       containers/home/home-loader.jsx, components/ui/hero-carousel and the
       "Hero loader crossfade" block in src/index.css) — same day/night
       crossfade timing, same rotating logo — so it can run before any JS has
       loaded. If that animation's timing, sizing or easing ever changes,
       update the three spots together (this replica, hero-carousel's JS
       constants, and src/index.css's @keyframes hero-night-crossfade) plus
       the FOURTH spot below — a second, byte-identical copy of
       @keyframes hero-night-crossfade itself, also inlined here for a
       real, unrelated reason documented at its own definition — or the
       pre-hydration splash and the post-hydration loader will visibly
       disagree for one loop. -->
  <style>
    /* Guarantee the dark background paints on the VERY FIRST frame — before
       Vite injects src/index.css (which sets --background via Tailwind).
       Without this, hsl(var(--background)) in index.css resolves to nothing
       and the browser paints a white page for the entire JS boot gap. */
    html, body {
      background-color: #0a0a0b; /* == hsl(240 10% 3.9%) == --background */
      margin: 0;
    }

    #app-boot-splash {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background-color: #0a0a0b;
    }

    #app-boot-splash .abs-slide {
      position: absolute;
      inset: 0;
      z-index: 1;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
    }

    #app-boot-splash .abs-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* Night layer: user set both boot-splash slides to the day image, so the
       overlay just stays hidden. The React HeroCarousel handles day→night
       crossfade after it mounts. */
    #app-boot-splash .abs-slide--night {
      z-index: 2;
      opacity: 0;
    }

    /* REAL BUG FIXED HERE: this is a second copy of src/index.css's
       @keyframes hero-night-crossfade (byte-identical body — keep them in
       sync), not just app-boot-crossfade's twin above. The React-rendered
       HeroCarousel (components/ui/hero-carousel) references
       "hero-night-crossfade" by name, but in dev mode Vite injects
       src/index.css's ~800-rule Tailwind stylesheet into a runtime <style>
       tag as a JS side effect of main.jsx's `import "./index.css"` — that
       injection is not guaranteed to have finished parsing into the CSSOM by
       the exact moment containers/global-loader or containers/home/
       home-loader first mounts and computes this element's style. Confirmed
       directly (Chrome DevTools Protocol, element.getAnimations()): when that
       race loses, the browser never creates a running Animation for the
       element — getComputedStyle still reports the animation-name/duration/
       delay as if everything were fine (it's just echoing the declared CSS),
       but nothing actually plays, so the overlay sits frozen at its static
       base opacity (1) for the element's entire lifetime — exactly the
       "carousel isn't working" symptom reported and reproduced this way, not
       any JS logic bug. A <style> tag inlined here parses synchronously
       during initial HTML parsing, before <script type="module" src="/src/
       main.jsx"> even begins fetching, so this specific rule is guaranteed to
       exist in the CSSOM before any script — dev or prod build alike — could
       possibly reference it. Harmless if src/index.css's copy loads later
       too: CSS permits redefining a @keyframes name, and the two are
       identical, so there is nothing to visually reconcile. */
    @keyframes hero-night-crossfade {
      0%, 32% { opacity: 0; }
      50%, 82% { opacity: 1; }
      100% { opacity: 0; }
    }

    #app-boot-splash .logo-wrap {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #app-boot-splash .logo-wrap svg {
      width: 60px;
      height: 60px;
      animation: app-boot-rotate 3s linear infinite;
      filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.9));
    }

    @media (min-width: 768px) {
      #app-boot-splash .logo-wrap svg {
        width: 90px;
        height: 90px;
      }
    }

    @keyframes app-boot-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Mirrors the portrait crop rule in src/index.css so the handoff to the
       real HomeLoader is pixel-identical. */
    @media (max-aspect-ratio: 1/1) {
      #app-boot-splash .abs-slide img {
        object-position: 45% center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-boot-splash .abs-slide--night,
      #app-boot-splash .logo-wrap svg {
        animation: none !important;
      }
    }
  </style>
